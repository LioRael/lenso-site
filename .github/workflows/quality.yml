name: quality

on:
  pull_request:
  push:
    branches:
      - main
      - "candidate/**"

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          package_json_file: package.json
          run_install: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
          node-version: 26.10.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check
        run: pnpm check
      - name: Preserve the exact checked static export
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lenso-site-static-${{ github.sha }}
          path: out/
          if-no-files-found: error
          retention-days: 3
  # Keep the repository's required check name. The linked Rust Marketplace is
  # archived; this now checks the published docs consumer and its real HTTP export.
  linked-site-integration:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          package_json_file: package.json
          run_install: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
          node-version: 26.10.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: lenso-site-static-${{ github.sha }}
          path: out/
      - name: Check the exact exported site through the public docs preview
        run: pnpm check:site-integration
