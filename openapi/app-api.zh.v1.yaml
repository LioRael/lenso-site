          type: array
          items:
            type: integer
            format: int64
            minimum: 0
          description: "尝试 2..N 之前的延迟长度必须等于 `max_attempts` - 1。"
        maxAttempts:
          type: integer
          format: int32
          description: "包括原始执行在内的总尝试次数。"
          minimum: 0
      additionalProperties: false
