  /oauth/authorize:
    get:
      tags:
      - auth
      summary: "Auth Oidc 授权"
      operationId: auth_oidc_authorize
      parameters:
      - name: response_type
        in: query
        description: "必须是`code`"
        required: true
        schema:
          type: string
      - name: client_id
        in: query
        description: "已注册 OIDC 客户端 ID"
        required: true
        schema:
          type: string
      - name: redirect_uri
        in: query
        description: "注册重定向 URI"
        required: true
        schema:
          type: string
      - name: scope
        in: query
        description: "空间分隔的范围，包括 `openid`"
        required: true
        schema:
          type: string
      - name: state
        in: query
        description: "不透明的客户端状态回显到重定向 URI"
        required: false
        schema:
          type: string
      - name: nonce
        in: query
        description: "与授权码一起存储的不透明随机数"
        required: false
        schema:
          type: string
      - name: code_challenge
        in: query
        description: "PKCE S256 代码挑战"
        required: true
        schema:
          type: string
      - name: code_challenge_method
        in: query
        description: "必须是`S256`"
        required: true
        schema:
          type: string
      responses:
        '303':
          description: "使用授权码重定向到已注册的重定向 URI"
        '400':
          description: "请求验证失败"
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: "需要身份验证"
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: "服务器内部错误"
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
