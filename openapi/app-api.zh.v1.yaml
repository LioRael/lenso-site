      type: object
      required:
      - name
      properties:
        compensation:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/WorkflowCompensationDeclaration'
            description: |-
              对此步骤已产生的业务效果执行的可选补偿。选择补偿时，会在所有
              已完成效果之间计算显式顺序；该顺序与完成时间无关。
