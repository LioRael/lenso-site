openapi: 3.1.0
info:
  title: "Lenso API"
  description: "Rust-first 模块化整体 API 合约"
  license:
    name: MIT
    identifier: MIT
  version: 1.0.0
paths:
  /.well-known/jwks.json:
    get:
      tags:
      - auth
      summary: "授权 Oidc Jwks"
      operationId: auth_oidc_jwks
      responses:
        '200':
          description: "OIDC JSON Web Key Set"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OidcJwksResponse'
        '404':
          description: "OIDC 提供商未启用"
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: "OIDC 提供程序配置无效"
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /.well-known/openid-configuration:
    get:
      tags:
      - auth
      summary: "身份验证 Oidc 提供商元数据"
      operationId: auth_oidc_provider_metadata
      responses:
        '200':
          description: "OIDC 提供者元数据"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OidcProviderMetadataResponse'
        '404':
          description: "OIDC 提供商未启用"
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: "OIDC 提供程序配置无效"
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /admin/config/descriptors:
    get:
      tags:
      - admin-config
      summary: "管理配置列表描述符"
      operationId: admin_config_list_descriptors
      parameters:
      - name: authorization
        in: header
        description: "开发服务承载令牌"
        required: true
        schema:
          type: string
      responses:
        '200':
          description: "注册的配置描述符"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigDescriptorListResponse'
        '401':
          description: "需要身份验证"
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: "需要服务或系统身份验证"
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /admin/config/values:
    get:
      tags:
      - admin-config
      summary: "管理配置列表值"
      operationId: admin_config_list_values
      parameters:
      - name: authorization
        in: header
        description: "开发服务承载令牌"
        required: true
        schema:
          type: string
      responses:
        '200':
          description: "有效的配置值"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigValueListResponse'
        '401':
          description: "需要身份验证"
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: "需要服务或系统身份验证"
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /admin/config/{service}/{key}:
    put:
      tags:
      - admin-config
      summary: "管理配置放置值"
      operationId: admin_config_put_value
      parameters:
      - name: service
        in: path
        description: "服务密钥：服务名称或 `*`（用于共享）"
        required: true
        schema:
          type: string
      - name: key
        in: path
        description: "配置键"
        required: true
        schema:
          type: string
      - name: authorization
        in: header
        description: "开发服务承载令牌"
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfigWriteRequest'
        required: true
      responses:
        '200':
          description: "写入值"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigWriteResponse'
        '400':
          description: "值验证失败"
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: "需要身份验证"
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: "配置键不可编辑"
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: "未知的配置键"
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: "服务器内部错误"
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags:
      - admin-config
      summary: "管理配置删除值"
      operationId: admin_config_delete_value
      parameters:
      - name: service
        in: path
        description: "服务密钥：服务名称或 `*`（用于共享）"
        required: true
        schema:
          type: string
      - name: key
        in: path
        description: "配置键"
        required: true
        schema:
          type: string
      - name: authorization
        in: header
        description: "开发服务承载令牌"
        required: true
        schema:
          type: string
      responses:
        '200':
          description: "值重置为默认值"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigWriteResponse'
        '401':
          description: "需要身份验证"
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: "未知的配置键"
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: "服务器内部错误"
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /admin/config/{service}/{key}/audit:
    get:
      tags:
      - admin-config
      summary: "管理配置获取审核"
      operationId: admin_config_get_audit
      parameters:
      - name: service
        in: path
        description: "服务键"
        required: true
        schema:
          type: string
      - name: key
        in: path
        description: "配置键"
        required: true
        schema:
          type: string
      - name: authorization
        in: header
        description: "开发服务承载令牌"
        required: true
        schema:
          type: string
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: "审核历史"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigAuditListResponse'
        '401':
          description: "需要身份验证"
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: "服务器内部错误"
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /admin/context:
    get:
      tags:
      - admin-system
      summary: "管理环境"
      operationId: admin_context
      parameters:
      - name: authorization
        in: header
        description: "开发服务承载令牌"
        required: true
        schema:
          type: string
      responses:
        '200':
          description: "当前Runtime Console管理员参与者上下文"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminContextResponse'
        '401':
          description: "需要身份验证"
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: "需要控制台管理范围"
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /admin/data/available-modules:
    get:
      tags:
      - admin-data
      summary: "管理数据可用模块"
      operationId: admin_data_available_modules
      parameters:
      - name: authorization
        in: header
        description: "开发服务承载令牌"
        required: true
        schema:
          type: string
      responses:
        '200':
          description: "可用的目录服务和链接的模块"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminModuleRegistrySnapshotResponse'
        '401':
          description: "需要身份验证"
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: "需要服务或系统身份验证"
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /admin/data/available-modules/{module}/install:
    post:
      tags:
      - admin-data
      summary: "管理数据安装可用模块"
      operationId: admin_data_install_available_module
      parameters:
      - name: module
        in: path
        description: "可用目录条目名称"
        required: true
        schema:
          type: string
      - name: authorization
        in: header
        description: "开发服务承载令牌"
        required: true
        schema:
          type: string
      responses:
        '200':
          description: "写入主机本地文件的目录安装状态"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminModuleInstallResponse'
        '400':
          description: "无法安装目录条目"
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: "需要身份验证"
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: "需要服务或系统身份验证"
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: "未知的可用模块"
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags:
      - admin-data
      summary: "管理数据卸载可用模块"
      operationId: admin_data_uninstall_available_module
      parameters:
      - name: module
        in: path
        description: "可用模块名称"
        required: true
        schema:
          type: string
      - name: authorization
        in: header
        description: "开发服务承载令牌"
        required: true
        schema:
          type: string
      responses:
        '200':
          description: "从主机本地文件中删除模块安装状态"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminModuleInstallResponse'
        '401':
          description: "需要身份验证"
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: "需要服务或系统身份验证"
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: "未知的可用模块"
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /admin/data/launchpad:
    get:
      tags:
      - admin-data
      summary: "管理数据启动板"
      operationId: admin_data_launchpad
      parameters:
      - name: authorization
        in: header
        description: "开发服务承载令牌"
        required: true
        schema:
          type: string
      responses:
        '200':
          description: "Launchpad 首次运行状态"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminLaunchpadResponse'
        '401':
          description: "需要身份验证"
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: "需要服务或系统身份验证"
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /admin/data/launchpad/change-plan:
    get:
      tags:
      - admin-data
      summary: "管理数据启动板变更计划"
      operationId: admin_data_launchpad_change_plan
      parameters:
      - name: authorization
        in: header
        description: "开发服务承载令牌"
        required: true
        schema:
          type: string
      responses:
        '200':
          description: "Launchpad 应用程序更改计划状态"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminLaunchpadChangePlanResponse'
        '401':
          description: "需要身份验证"
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: "需要服务或系统身份验证"
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /admin/data/launchpad/doctor:
    get:
      tags:
      - admin-data
      summary: "管理数据Launchpad Doctor"
      operationId: admin_data_launchpad_doctor
      parameters:
      - name: authorization
        in: header
        description: "开发服务承载令牌"
        required: true
        schema:
          type: string
      responses:
        '200':
          description: "Launchpad 开发 Doctor状态"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminLaunchpadDoctorResponse'
        '401':
          description: "需要身份验证"
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: "需要服务或系统身份验证"
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /admin/data/launchpad/proof:
    get:
      tags:
      - admin-data
      summary: "管理数据启动板证明"
      operationId: admin_data_launchpad_proof
      parameters:
      - name: authorization
        in: header
        description: "开发服务承载令牌"
        required: true
        schema:
          type: string
      responses:
        '200':
          description: "Launchpad 应用程序证明状态"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminLaunchpadProofResponse'
        '401':
          description: "需要身份验证"
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: "需要服务或系统身份验证"
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /admin/data/module-registry/snapshot:
    get:
      tags:
      - admin-data
      summary: "管理数据模块注册表快照"
      operationId: admin_data_module_registry_snapshot
      parameters:
      - name: authorization
        in: header
        description: "开发服务承载令牌"
        required: true
        schema:
          type: string
      responses:
        '200':
          description: "可用目录服务的旧别名"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminModuleRegistrySnapshotResponse'
        '401':
          description: "需要身份验证"
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: "需要服务或系统身份验证"
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /admin/data/modules:
    get:
      tags:
      - admin-data
      summary: "管理数据列表模块"
      operationId: admin_data_list_modules
      parameters:
      - name: authorization
        in: header
        description: "开发服务承载令牌"
        required: true
        schema:
          type: string
      responses:
        '200':
          description: "所有模块注册表元数据"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminModuleMetadataListResponse'
        '401':
          description: "需要身份验证"
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: "需要服务或系统身份验证"
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /admin/data/modules/refresh:
    post:
      tags:
      - admin-data
      summary: "管理数据刷新模块"
      operationId: admin_data_refresh_modules
      parameters:
      - name: authorization
        in: header
        description: "开发服务承载令牌"
        required: true
        schema:
          type: string
      responses:
        '200':
          description: "刷新后的模块注册表元数据快照"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminModuleMetadataListResponse'
        '401':
          description: "需要身份验证"
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: "需要服务或系统身份验证"
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: "模块注册表刷新不可用"
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /admin/data/schema:
    get:
      tags:
      - admin-data
      summary: "管理数据列表架构"
      operationId: admin_data_list_schemas
      parameters:
      - name: authorization
        in: header
        description: "开发服务承载令牌"
        required: true
        schema:
          type: string
      responses:
        '200':
          description: "所有具有管理功能的模块的架构"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminSchemaListResponse'
        '401':
          description: "需要身份验证"
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: "需要服务或系统身份验证"
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /admin/data/schema/refresh:
    post:
      tags:
      - admin-data
      summary: "管理数据刷新架构"
      operationId: admin_data_refresh_schemas
      parameters:
      - name: authorization
        in: header
        description: "开发服务承载令牌"
        required: true
        schema:
          type: string
      responses:
        '200':
          description: "刷新了具有管理功能的模块的架构"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminSchemaRefreshResponse'
        '401':
          description: "需要身份验证"
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: "需要服务或系统身份验证"
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: "管理模块刷新不可用或失败"
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /admin/data/service-modules:
    get:
      tags:
      - admin-data
      summary: "管理数据服务模块"
      operationId: admin_data_service_modules
      parameters:
      - name: authorization
        in: header
        description: "开发服务承载令牌"
        required: true
        schema:
          type: string
      responses:
        '200':
          description: "服务提供者生命周期状态"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminServiceModuleLifecycleResponse'
        '401':
          description: "需要身份验证"
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: "需要服务或系统身份验证"
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /admin/data/service-system:
    get:
      tags:
      - admin-data
      summary: "管理数据服务系统"
      operationId: admin_data_service_system
      parameters:
      - name: authorization
        in: header
        description: "开发服务承载令牌"
        required: true
        schema:
          type: string
      responses:
        '200':
          description: "服务体系图"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminServiceSystemResponse'
        '401':
          description: "需要身份验证"
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: "需要服务或系统身份验证"
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /admin/data/service-system/drift:
    get:
      tags:
      - admin-data
      summary: "管理数据服务系统漂移"
      operationId: admin_data_service_system_drift
      parameters:
      - name: authorization
        in: header
        description: "开发服务承载令牌"
        required: true
        schema:
          type: string
      responses:
        '200':
          description: "服务系统与主机本地状态的偏差"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminServiceSystemDriftResponse'
        '401':
          description: "需要身份验证"
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: "需要服务或系统身份验证"
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /admin/data/service-system/release-train:
    get:
      tags:
      - admin-data
      summary: "管理数据服务系统发布列车"
      operationId: admin_data_service_system_release_train
      parameters:
      - name: authorization
        in: header
        description: "开发服务承载令牌"
        required: true
        schema:
          type: string
      responses:
        '200':
          description: "应用系统发布列车历史记录"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminServiceSystemReleaseTrainResponse'
        '401':
          description: "需要身份验证"
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: "需要服务或系统身份验证"
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /admin/data/service-system/runbooks:
    get:
      tags:
      - admin-data
      summary: "管理数据服务系统操作手册"
      operationId: admin_data_service_system_runbooks
      parameters:
      - name: authorization
        in: header
        description: "开发服务承载令牌"
        required: true
        schema:
          type: string
